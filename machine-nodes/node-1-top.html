<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>节点1 · 顶部招牌+状态行</title>
<style>
  body{margin:0;background:#0b0e1a;color:#E8ECF8;font-family:-apple-system,"PingFang SC",sans-serif;padding:22px;}
  .wrap{max-width:760px;margin:0 auto;}
  a.back{color:#9aa3c4;font-size:13px;text-decoration:none;}
  h1{font-size:20px;margin:10px 0 4px;color:#FFD23C;}
  .sub{color:#9aa3c4;font-size:13px;line-height:1.7;margin-bottom:16px;}
  .card{background:#141933;border:1px solid #2a3358;border-radius:14px;padding:14px;}
  .card svg{width:100%;height:auto;display:block;}
  .toolbar{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  .toolbar button{background:#1b2347;color:#E8ECF8;border:1px solid #2a3358;border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer;}
  .toolbar button:hover{border-color:#FFC400;}
  .toolbar .hint{font-size:12px;color:#9aa3c4;}
  h3{font-size:14px;color:#FFD23C;margin:18px 0 6px;}
  .mini{background:#141933;border:1px solid #2a3358;border-radius:14px;padding:8px;max-width:280px;}
  .mini svg{width:100%;height:auto;display:block;}
  code{background:#1b2347;padding:1px 6px;border-radius:4px;color:#FFD23C;font-size:12px;}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← 节点总览</a>
  <h1>节点 1 · 顶部：当前弹珠 / 奖励数值</h1>
  <p class="sub">机台顶部招牌 LED 跑马灯「弹珠乐园」+ 状态行：<b>当前弹珠 · 领珠(可隐藏) · 当前奖励弹珠</b>，去除背景色块与杂色，仅用分隔线区分三栏。<br>
  机台坐标：横跨整宽 <code>x∈[-280,280]</code>，位于顶部 <code>y∈[288,490]</code>（扁平坐标，y 向上）。</p>
  <div class="toolbar"><button id="toggleClaim">隐藏领珠</button><span class="hint">领珠为可隐藏项，演示隐藏/显示</span></div>
  <div class="card"><div id="stage"></div></div>
  <h3>在机器中的位置</h3>
  <div class="mini"><div id="mini"></div></div>
</div>
<script src="common.js"></script>
<script>
renderNode(document.getElementById('stage'),'top');
renderMini(document.getElementById('mini'),'top');
const btn=document.getElementById('toggleClaim');
btn.addEventListener('click',()=>{
  const g=document.getElementById('claimGroup');
  if(!g) return;
  const hidden=g.style.display==='none';
  g.style.display=hidden?'':'none';
  btn.textContent=hidden?'隐藏领珠':'显示领珠';
});
</script>
</body>
</html>
